# Categories for the GitHub "Generate release notes" button.
# Published release bodies are sourced from CHANGELOG.md by the release workflow.
changelog:
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - dependencies
        - maintenance
    - title: Other changes
      labels:
        - '*'
