name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p xecute --no-default-features --locked
      - name: Verify MVC and CQRS generated applications against this runtime
        shell: bash
        run: |
          cargo build -p xecute-cli --locked
          cli="$GITHUB_WORKSPACE/target/debug/xecute"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/generated-target"
          cd "$RUNNER_TEMP"
          for architecture in mvc cqrs; do
            project="test-$architecture"
            "$cli" new "$project" "--$architecture" --runtime-path "$GITHUB_WORKSPACE/xecute"
            cargo generate-lockfile --manifest-path "$project/Cargo.toml"
            cargo fmt --manifest-path "$project/Cargo.toml" --all -- --check
            cargo clippy --manifest-path "$project/Cargo.toml" --all-targets --all-features --locked -- -D warnings
            cargo test --manifest-path "$project/Cargo.toml" --all-features --locked
          done

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xecute
          POSTGRES_PASSWORD: xecute_ci_only
          POSTGRES_DB: xecute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xecute -d xecute_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://xecute:xecute_ci_only@127.0.0.1:5432/xecute_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: cargo test -p xecute --features postgres,testing --test postgres --locked
      - run: cargo test -p xecute --features postgres,testing --test postgres --locked -- --ignored

  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: cargo test -p xecute --features jobs,cache-redis,testing --test jobs --test cache --test cache_redis --example jobs_cache --locked -- --include-ignored
