name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p xecute --no-default-features --locked
      - name: Verify MVC and CQRS generated applications against this runtime
        shell: bash
        run: |
          cargo build -p xecute-cli --locked
          cli="$GITHUB_WORKSPACE/target/debug/xecute"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/generated-target"
          cd "$RUNNER_TEMP"
          for architecture in mvc cqrs; do
            project="test-$architecture"
            "$cli" new "$project" "--$architecture" --runtime-path "$GITHUB_WORKSPACE/xecute"
            cargo generate-lockfile --manifest-path "$project/Cargo.toml"
            cargo fmt --manifest-path "$project/Cargo.toml" --all -- --check
            cargo clippy --manifest-path "$project/Cargo.toml" --all-targets --all-features --locked -- -D warnings
            cargo test --manifest-path "$project/Cargo.toml" --all-features --locked
          done
