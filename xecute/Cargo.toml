[package]
name = "xecute"
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
description = "Application architecture tools and macros for Axum"
license.workspace = true
repository = "https://github.com/morshedulmunna/xecute"
homepage = "https://github.com/morshedulmunna/xecute"
documentation = "https://docs.rs/xecute"
readme = "README.md"
keywords = ["dependency-injection", "axum", "modules"]
categories = ["web-programming", "rust-patterns"]

[features]
default = []
testing = ["dep:tower", "dep:tokio"]
upload = ["axum/multipart", "dep:tokio", "tokio/fs", "tokio/io-util", "tokio/rt", "dep:tempfile", "dep:infer", "dep:sha2"]
upload-s3 = ["upload", "dep:aws-sdk-s3", "dep:aws-config"]

[dependencies]
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aws-config = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
tempfile = { version = "3", optional = true }
infer = { version = "0.22", optional = true }
sha2 = { version = "0.11", optional = true }
toml = "1"
tokio = { version = "1", features = ["time"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
axum = "0.8"
schemars = "1.2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
xmacros = { version = "0.1.6", path = "../xmacros" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"

[[example]]
name = "file_upload"
required-features = ["upload"]
