[package]
name = "xecute"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
description = "Modules and dependency injection for Axum"
license.workspace = true
repository = "https://github.com/morshedulmunna/xecute"
homepage = "https://github.com/morshedulmunna/xecute"
documentation = "https://docs.rs/xecute"
readme = "README.md"
keywords = ["dependency-injection", "axum", "modules"]
categories = ["web-programming", "rust-patterns"]

[dependencies]
axum = "0.8"
schemars = "1.2"
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
xmacros = { version = "0.1.5", path = "../xmacros" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
