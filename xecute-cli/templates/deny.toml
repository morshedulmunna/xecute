# Install with `cargo install cargo-deny --locked`, then run `cargo deny check`.
[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
