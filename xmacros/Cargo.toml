[package]
name = "xmacros"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
description = "Application architecture and dependency-injection macros for Axum"
license.workspace = true
repository = "https://github.com/morshedulmunna/xecute"
homepage = "https://github.com/morshedulmunna/xecute"
documentation = "https://docs.rs/xmacros"
readme = "README.md"
keywords = ["axum", "dependency-injection", "macros"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.6", features = ["full"] }

[lints]
workspace = true
