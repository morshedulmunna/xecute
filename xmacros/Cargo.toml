[package]
name = "xmacros"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
description = "Dependency-injection and Axum route macros for Xecute applications"
license.workspace = true
repository = "https://github.com/xecuteai/xecuteai"
homepage = "https://github.com/xecuteai/xecuteai"
documentation = "https://docs.rs/xmacros"
readme = "README.md"
keywords = ["axum", "dependency-injection", "macros"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.6", features = ["full"] }

[lints]
workspace = true
